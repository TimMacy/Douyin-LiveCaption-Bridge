<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Douyin Live Caption Bridge by Tim Macy</title>
    <style>
        body {
            max-width: 720px;
            margin: 48px auto;
            padding: 0 24px;
            color: white;
            background-color: black;
            font: 16px/1.5 system-ui, sans-serif;
        }

        #controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #playback {
            width: 5.5em;
            flex-shrink: 0;
        }

        #stop {
            margin-left: auto;
        }

        #volume {
            vertical-align: middle;
        }

        button {
            padding: 10px 14px;
            font: inherit;
            cursor: pointer;
        }

        #status {
            font-weight: 600;
            min-height: 3em;
        }
    </style>
</head>

<body>
    <h1>Douyin Live Caption Bridge</h1>
    <p id="status">Starting...</p>
    <p id="controls">
        <button id="playback" type="button" disabled>Play</button>
        <label>Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="1" disabled></label>
        <button id="stop" type="button">Stop bridge</button>
    </p>
    <script src="bridge.js"></script>
</body>

</html>
